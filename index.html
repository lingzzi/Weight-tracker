<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="google" content="notranslate">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="manifest" href="manifest.json">
  <title>Weight tracker</title>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered!', reg))
          .catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>
  <style>
    /* 1. 内联 CSS：让启动页瞬间渲染 */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .fade-out {
      animation: fadeOut 0.5s forwards;
    }
    @keyframes fadeOut {
      from {
        opacity: 1;
      }
      to {
        opacity: 0;
      }
    }
  </style>

</head>
<body>
  <div id="splash-screen">加载中...</div>
  
  <div id="app" style="display: none;">
    
      <!-- Dialog overlay -->
      <div class="screen">
        <!-- Delete & Greeting -->
      
        <div class="header">
      
          <div id="header-greeting">
            <span class="headline-large">Good morning!</span>
            <svg version="1.1" id="emoji-cloud" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
              x="0px" y="0px" viewBox="0 0 128 128" style="enable-background:new 0 0 128 128;" xml:space="preserve">
              <path style="fill:#E4EAEE;" d="M23.45,62.3c0.72-0.72-1.27-9.29,7.6-15.91s14.92-2.67,15.77-2.96c0.84-0.28,4.79-17.6,21.4-22.1
                        s33.93,3.94,38.01,18.02c3.73,12.87,0.84,21.54,1.27,22.1c0.42,0.56,8.45,0.28,13.09,7.74s2.96,12.11,2.96,12.11l-29.56,9.15h-47.3
                        c0,0-41.67-10.98-42.09-12.95c-0.42-1.97,0.53-8.37,7.32-12.25C17.82,61.88,22.18,63.57,23.45,62.3z" />
              <path style="fill:#BACDD2;" d="M35.16,92.84c0,0-15.78,3.3-26.45-4.96C2.29,82.9,4.63,74.83,4.63,74.83s4.6,4.65,13.89,5.91
                        c9.29,1.27,19.71,0.84,19.71,0.84s2.6,4.44,12.39,6.48c12.27,2.55,18.74-3.73,18.74-3.73s3.36,4.02,15.19,4.3
                        c11.83,0.28,18.46-7.98,19.57-8.17c0.56-0.09,3.82,2.87,10.28,1.83c6.15-0.99,9.39-3.66,9.39-3.66s0.89,6.62-5.3,10.7
                        c-4.83,3.18-13.23,3.52-13.23,3.52s-1.28,4.91-7.05,8.48c-5.36,3.33-14.6,4.44-21.44,2.4c-8.59-2.56-10.72-6.47-10.72-6.47
                        s-6.4,3.75-16.4,2.48C40.2,98.56,35.16,92.84,35.16,92.84z" />
            </svg>
          </div>
      
          <button class="icon-button" id="open-dialog-btn" aria-haspopup="dialog" aria-controls="dialog-backdrop">
            <span class="material-symbols-outlined">mop</span>
          </button>
        </div>
      
        <!-- Today's weight and the goal-->
        <div class="card-row">
      
          <div class="card-vertical">
            <p class="title-small">Today's weight</p>
            <p class="display-medium" id="today-weight">0.0kg</p>
          </div>
      
          <!-- small confirmation dialog -->
          <div class="dialog-backdrop" id="dialog-backdrop" hidden>
            <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
              <div class="dialog-header">
                <span class="material-symbols-outlined dialog-icon">mop</span>
                <h3 id="dialog-title" class="title-large">Clear all records</h3>
              </div>
              <div class="dialog-content body-large">
                <p>This will permanently remove all your recorded entries.</p>
              </div>
              <div class="dialog-actions">
                <button id="dialog-cancel" class="secondary-text-btn label-large">Cancel</button>
                <button id="dialog-confirm" class="filled-secondary-btn label-large">Clear</button>
              </div>
            </div>
          </div>
      
      
          <div class="card-vertical">
            <p class="title-small">To reach the goal</p>
            <p class="display-medium" id="weight-to-goal">0.0kg</p>
          </div>
      
        </div>
      
        <!-- Changes in weight -->
        <div class="card-row">
      
          <div class="card-horizontal">
      
            <div class="card-inside">
              <p class="title-small">Total</p>
              <p class="label-large" id="total-weight-change">0.0kg</p>
            </div>
      
            <div class="card-inside">
              <p class="title-small">Today</p>
              <p class="label-large" id="today-weight-change">0.0kg</p>
            </div>
      
            <div class="card-inside">
              <p class="title-small">This week</p>
              <p class="label-large" id="this-week-weight-change">0.0kg</p>
            </div>
      
            <div class="card-inside">
              <p class="title-small">This month</p>
              <p class="label-large" id="this-month-weight-change">0.0kg</p>
            </div>
      
          </div>
      
        </div>
      
        <!-- the pop-up "add weight" bottom sheet -->
        <div class="overlay" id="overlay">
          <div class="bottom-sheet">
      
            <div class="bottom-sheet-top-content">
              <p class="title-large" id="bottom-sheet-title">Add a record</p>
              <input id="input-weight" type="number" placeholder="Weight" />
            </div>
      
            <div class="action-bar">
              <input type="date" id="date-picker" style="display:none">
              <button id="date-btn" class="secondary-text-btn label-large">Today</button>
              <button id="save-btn" class="filled-primary-btn label-large">Save</button>
            </div>
          </div>
        </div>
      
        <!-- the chart  -->
        <canvas id="weight-chart" width="400" height="300"></canvas>
      
        <button class="FAB" id="open-bottom-sheet">
          <span class="material-symbols-outlined">add</span>
        </button>
        
        <!-- Edit and Delete buttons (initially hidden) -->
        <div class="edit-delete-container" id="edit-delete-container" style="display: none;">
          <button class="FAB delete-btn" id="delete-btn">
            <span class="material-symbols-outlined">delete</span>
          </button>
          <button class="FAB edit-btn" id="edit-btn">
            <span class="material-symbols-outlined">edit</span>
          </button>
        </div>
  </div>
  
  <script>
    window.addEventListener('load', function () {
      const splash = document.getElementById('splash-screen');
      const app = document.getElementById('app');

      // 第一步：显示 App 容器
      app.style.display = 'block';

      // 第二步：触发 CSS 动画
      splash.classList.add('fade-out');

      // 第三步：动画结束后移除 DOM
      setTimeout(function () {
        splash.remove();
      }, 500);
    });
  </script>


    <script src="chart.js"></script>

    <script>
      (function(){
        const openBtn = document.getElementById('open-dialog-btn');
        const backdrop = document.getElementById('dialog-backdrop');
        const cancel = document.getElementById('dialog-cancel');
        const confirm = document.getElementById('dialog-confirm');

        function openDialog(){
          backdrop.hidden = false;
        }
        function closeDialog(){
          backdrop.hidden = true;
        }

        openBtn?.addEventListener('click', openDialog);
        cancel?.addEventListener('click', closeDialog);
        confirm?.addEventListener('click', () => {
          if (window.clearAllEntries) window.clearAllEntries()
          closeDialog();
        });

        // Dismiss when clicking outside the dialog box
        backdrop?.addEventListener('click', (e) => {
          if (e.target === backdrop) closeDialog();
        });

        // Dismiss with Escape key
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && backdrop && !backdrop.hidden) closeDialog();
        });
      })();
    </script>


  </div>
</body>
</html>
